<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>image-scanner</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <link rel="stylesheet" href="style.css" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Hobby Lair">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" href="icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
</head>

<body>
    <div id="back">Main Menu</div>
    <div id="main-heading">Paint Inventory</div>
    <div id="sub-heading">Manage/Edit Paint Items</div>

    <div id="paint-list"></div>

    <div id="edit-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Edit Paint</h2>
            <label for="edit-brand">Brand Name</label>
            <input type="text" id="edit-brand">

            <label for="edit-code">Color Code</label>
            <input type="text" id="edit-code">

            <label for="edit-name">Color Name</label>
            <input type="text" id="edit-name">

            <label for="edit-fullness">Fullness</label>
            <select id="edit-fullness">
                <option value="Full">Full</option>
                <option value="Half">Half</option>
                <option value="Low">Low</option>
                <option value="Empty">Empty</option>
            </select>

            <div class="modal-buttons">
                <button id="save-edit">Save</button>
                <button id="delete-paint">Delete</button>
                <button id="close-edit">Cancel</button>
            </div>
        </div>
    </div>
    <script src="sw-register.js"></script>
    <script src="paint-color.js"></script>
    <script src="paint-inventory.js"></script>
</body>

</html>
