<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>image-scanner</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <link rel="stylesheet" href="style.css" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Hobby Lair">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" href="icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
</head>

<body>
    <div id="back">Main Menu</div>
    <div id="main-heading">Upload Paint</div>

    <div class="output">
        <video id="video-feed" autoplay playsinline muted></video>
        <img id="snapshot-result" alt="Snapshot result">
    </div>

    <canvas id="capture-canvas" style="display: none;"></canvas>

    <div class="paint-buttons">
        <!-- <div id="left">
            <div id="scan-image">Scan Paint</div>
        </div> -->
        <div id="middle">
            <div id="upload-image">Upload Paint</div>
        </div>
        <div id="right">
            <div id="snap-image">Take Snapshot</div>
        </div>
    </div>

    <div id="paint-form-box">
        <div class="paint-form">
            <label for="brand-name">Brand Name</label>
            <input type="text" id="brand-name" placeholder="e.g. Tamiya">
        </div>
        <div class="paint-form">
            <label for="color-code">Color Code</label>
            <input type="text" id="color-code" placeholder="e.g. X-4">
        </div>
        <div class="paint-form">
            <label for="color-name">Color Name</label>
            <input type="text" id="color-name" placeholder="e.g. Red">
        </div>
        <div class="paint-form">
            <label for="paint-fullness">Fullness</label>
            <select id="paint-fullness">
                <option value="Full">Full</option>
                <option value="Half">Half</option>
                <option value="Low">Low</option>
                <option value="Empty">Empty</option>
            </select>
        </div>
    </div>

    <script src="sw-register.js"></script>
    <script src="upload-paint.js"></script>
</body>

</html>
